<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>童趣聖經金句花園 🌟</title>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Nunito:wght@700&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans TC', 'ZCOOL KuaiLe', cursive, sans-serif;
            background: linear-gradient(135deg, #e0f7fa, #fce4ec, #fff9c4);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 頂部標題 */
        header {
            text-align: center;
            margin-bottom: 25px;
            animation: bounceIn 1s ease;
        }

        h1 {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 2.5rem;
            color: #ff6f61;
            text-shadow: 2px 2px 0px #fff, 4px 4px 0px rgba(255, 182, 193, 0.5);
            margin-bottom: 5px;
        }

        p.subtitle {
            font-size: 1.1rem;
            color: #5c6bc0;
            font-weight: bold;
        }

        /* 主容器與卡片 */
        .card-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            min-height: 380px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border: 5px solid #fff;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            animation: popUp 0.6s ease;
        }

        .card-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        .date-badge {
            background-color: #ffb74d;
            color: white;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(255, 183, 77, 0.4);
            margin-bottom: 15px;
        }

        .illustration {
            font-size: 4rem;
            margin: 10px 0;
            animation: floatAni 3s ease-in-out infinite;
        }

        .verse-text {
            font-size: 1.35rem;
            color: #4a4a4a;
            line-height: 1.8;
            font-weight: 700;
            margin: 15px 0;
            word-break: break-all;
        }

        .verse-ref {
            font-size: 1rem;
            color: #ab47bc;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* 按鈕導航區 */
        .nav-buttons {
            display: flex;
            gap: 20px;
            margin-top: 25px;
        }

        button.btn {
            background-color: #4db6ac;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(77, 182, 172, 0.4);
            transition: all 0.2s ease;
        }

        button.btn:hover {
            background-color: #26a69a;
            transform: scale(1.05);
        }

        button.btn:active {
            transform: scale(0.95);
        }

        /* 動畫效果定義 */
        @keyframes popUp {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes floatAni {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* 飄浮背景裝飾 */
        .bg-decorations {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 100px;
            animation: moveCloud 20s linear infinite;
        }

        @keyframes moveCloud {
            from { transform: translateX(-150px); }
            to { transform: translateX(calc(100vw + 150px)); }
        }

        /* 響應式調整 */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .verse-text { font-size: 1.15rem; }
            .card-container { padding: 20px; min-height: 340px; }
        }
    </style>
</head>
<body>

    <div class="bg-decorations">
        <div class="cloud" style="width: 100px; height: 40px; top: 10%; animation-duration: 25s;"></div>
        <div class="cloud" style="width: 150px; height: 60px; top: 40%; animation-duration: 35s; animation-delay: -5s;"></div>
        <div class="cloud" style="width: 80px; height: 35px; top: 75%; animation-duration: 20s; animation-delay: -10s;"></div>
    </div>

    <header>
        <h1>🌟 寶貝聖經金句樂園 🌟</h1>
        <p class="subtitle">天天跟著上帝一起開心長大！</p>
    </header>

    <div class="card-container" id="cardBox">
        <div class="date-badge" id="dateBadge">115年9月5日</div>
        <div class="illustration" id="cardEmoji">🦁</div>
        <div class="verse-text" id="verseText">「因為上帝賜給我們，不是膽怯的心，乃是剛強、仁愛、謹守的心。」</div>
        <div class="verse-ref" id="verseRef">✨ 提摩太後書 1章7節 ✨</div>
    </div>

    <div class="nav-buttons">
        <button class="btn" onclick="prevVerse()">⬅️ 上一篇</button>
        <button class="btn" onclick="nextVerse()">下一篇 ➡️</button>
    </div>

    <script>
        // 金句資料庫
        const verses = [
            {
                date: "115年9月5日",
                emoji: "🦁",
                text: "「因為上帝賜給我們，不是膽怯的心，乃是剛強、仁愛、謹守的心。」",
                ref: "✨ 提摩太後書 1章7節 ✨"
            },
            {
                date: "115年9月19日",
                emoji: "🌙",
                text: "「神祂造月亮星宿管黑夜，因祂的慈愛永遠長存。」",
                ref: "✨ 詩篇 136篇9節 ✨"
            },
            {
                date: "115年10月3日",
                emoji: "🐻",
                text: "「你們要將一切的憂慮卸給上帝，因為祂顧念你們。」",
                ref: "✨ 彼得前書 5章7節 ✨"
            },
            {
                date: "115年10月24日",
                emoji: "🌻",
                text: "「上帝看著一切所造的都甚好。有晚上，有早晨…」",
                ref: "✨ 創世記 1章31節上 ✨"
            },
            {
                date: "115年11月7日",
                emoji: "🐰",
                text: "「只要你行公義，好憐憫，存謙卑的心，與你的上帝同行。」",
                ref: "✨ 彌迦書 6章8節下 ✨"
            },
            {
                date: "115年11月14日",
                emoji: "🍬",
                text: "「朋友乃時常親愛，弟兄為患難而生。」",
                ref: "✨ 箴言 17章17節 ✨"
            },
            {
                date: "115年12月5日",
                emoji: "🦔",
                text: "「要愛你們的仇敵，為那逼迫你們的禱告。」",
                ref: "✨ 馬太福音 5章44節下 ✨"
            },
            {
                date: "115年12月12日",
                emoji: "🎁",
                text: "「最要緊的是彼此切實相愛，因為愛能遮掩許多的罪。」",
                ref: "✨ 彼得前書 4章8節 ✨"
            }
        ];

        let currentIndex = 0;

        function updateCard() {
            const cardBox = document.getElementById('cardBox');
            
            // 加上淡入淡出與彈跳動畫
            cardBox.style.animation = 'none';
            cardBox.offsetHeight; // 觸發重繪
            cardBox.style.animation = 'popUp 0.5s ease';

            // 替換內容
            document.getElementById('dateBadge').innerText = verses[currentIndex].date;
            document.getElementById('cardEmoji').innerText = verses[currentIndex].emoji;
            document.getElementById('verseText').innerText = verses[currentIndex].text;
            document.getElementById('verseRef').innerText = verses[currentIndex].ref;
        }

        function nextVerse() {
            currentIndex = (currentIndex + 1) % verses.length;
            updateCard();
        }

        function prevVerse() {
            currentIndex = (currentIndex - 1 + verses.length) % verses.length;
            updateCard();
        }
    </script>
</body>
</html>
